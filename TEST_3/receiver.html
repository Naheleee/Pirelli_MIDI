<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirelli</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
</head>

<body>
    <div class="container">
        <div class="box1">
            <div class="section1">
                <div class="cell1">
                    <p class="titolo">PIRELLI</p>
                </div>
                <div class="cell2">
                    <div class="handtracking1">
                        <p class="glifo1">•</p>
                    </div>
                    <div class="handtracking2">
                        <p class="glifo2">•</p>
                    </div>
                    <div class="launchpad-visualizer"></div>
                </div>
            </div>
            <div class="section2">
                <p class="lettera">A</p>
            </div>
        </div>
        <div class="box2">
            <p class="font-info1">
                <p>Width: 500</p>
                <p>Style: Regular</p>
                <p>Visibility: ON</p>
                <p>Music: Ocean</p>
            </p>
        </div>
        <div class="box3">
            <p class="font-info2">"Messaggio Terminale"</p>
        </div>
        <div class="box4">
            <div class="square1"></div>
            <div class="audio-visualizer">
                <div class="audio-visualizer-top"></div>
                <div class="audio-visualizer-bottom"></div>
            </div>
            <div class="square2"></div>
        </div>
        <div class="box5">
            <div class="lettere"></div>
        </div>
    </div>
    <script src="Javascript/script.js"></script>
</body>

</html>
