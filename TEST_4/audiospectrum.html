<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Spectrum Visualizer</title>
    <style>
        @font-face {
            font-family: PirelliVar;
            src: url('fonts/PirelliVar.woff2') format('woff2-variations');
            font-stretch: 100% 500%;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        /* Base styles matching the required colors and typography */
        body {
            position: relative;
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #f46404;
            font-family: PirelliVar;
            overflow: hidden; /* Prevent scrollbars */
            box-sizing: border-box;
        }

        /* Top HUD container for Stats */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: clamp(4px, 3vmin, 2rem);
            box-sizing: border-box;
            pointer-events: none; /* Let clicks pass through to canvas */
            z-index: 10;
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            text-transform: uppercase;
           font-variation-settings: "wdth" 500; /* Default weight and width */
        }

        .hud-center {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: clamp(3px, 2vmin, 10px);
        }

        .dot {
            display: inline-block;
            width: clamp(4px, 3vmin, 14px);
            height: clamp(4px, 3vmin, 14px);
            background-color: #f46404;
            border-radius: 50%;
            /* 70 BPM = 60 / 70 seconds = ~0.857s per beat */
            animation: blink 0.857s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0; }
        }

        /* Start Button Overlay */
        #overlay {
            position: absolute;
            font-variation-settings: "wdth" 500;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: rgba(26, 26, 26, 0.85);
            z-index: 20;
            transition: opacity 0.5s ease;
        }

        #start-btn {
            font-variation-settings: "wdth" 500;
            background-color: transparent;
            color: #f46404;
            border: 1px solid #f46404;
            max-width: 100%;
            padding: clamp(6px, 3vmin, 15px) clamp(8px, 5vmin, 40px);
            font-size: clamp(8px, 3.2vmin, 1.2rem);
            font-family: inherit;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: clamp(0px, 0.5vmin, 2px);
            cursor: pointer;
            border-radius: 25px;
          
        }

        #start-btn:hover {
            background-color: #f46404;
            color: #1a1a1a;
        }

        .instructions {
            max-width: 100%;
            margin-top: clamp(4px, 2vmin, 15px);
            font-size: clamp(7px, 2.4vmin, 0.9rem);
            opacity: 0.8;
            letter-spacing: clamp(0px, 0.25vmin, 1px);
            text-align: center;
        }

        /* The Canvas */
        canvas {
            display: block;
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- Heads Up Display -->
    <div id="hud">
        <div id="vol-text">0%</div>
        <div class="hud-center">BPM 70 <span class="dot"></span></div>
        <div id="db-text">0DB</div>
    </div>

    <!-- Start Button Overlay for permissions -->
    <div id="overlay">
        <div style="display: flex; flex-direction: column; align-items: center;">
            <button id="start-btn">CAPTURE DESKTOP AUDIO</button>
            <div class="instructions">Important: Check the "Share system audio" box in the browser prompt.</div>
        </div>
    </div>

    <!-- Visualization Canvas -->
    <canvas id="visualizer"></canvas>

    <script>
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const startBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('overlay');
        const volEl = document.getElementById('vol-text');
        const dbEl = document.getElementById('db-text');

        let audioCtx;
        let analyser;
        let dataArray;
        
        // Settings for the "low vertex" angular look
        const NUM_VERTICES = 16; // Very low point count across the whole width
        const COLOR = '#f46404';
        const NOISE_GATE_THRESHOLD = 0.005; // Threshold for RMS to consider it "silence"

        // Resize Canvas to fit its containing panel
        function resize() {
            const { width, height } = canvas.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(width * dpr);
            canvas.height = Math.round(height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);
        new ResizeObserver(resize).observe(document.body);
        resize(); // Initial resize

        // Initialize Audio context and start drawing
        startBtn.addEventListener('click', async () => {
            try {
                // Request Desktop Audio permissions
                // Note: video: true is required by browsers to prompt for screen sharing
                const stream = await navigator.mediaDevices.getDisplayMedia({ 
                    video: true,
                    audio: true 
                });
                
                // We don't need the video track, so we can stop it if one was created
                const videoTracks = stream.getVideoTracks();
                if (videoTracks.length > 0) {
                    // We let it run but we don't render it anywhere, just extracting audio.
                }
                
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioCtx.createMediaStreamSource(stream);
                
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 1024; // Capture standard resolution
                source.connect(analyser);
                
                dataArray = new Uint8Array(analyser.frequencyBinCount);
                
                // Hide button overlay
                overlay.style.opacity = '0';
                setTimeout(() => { overlay.style.display = 'none'; }, 500);

                // Start the animation loop
                draw();
            } catch (err) {
                console.error("Error accessing desktop audio:", err);
                startBtn.innerText = "Audio Access Denied";
                startBtn.style.pointerEvents = "none";
            }
        });

        // The main visualization loop
        function draw() {
            requestAnimationFrame(draw);

            // Get time-domain data (waveform)
            analyser.getByteTimeDomainData(dataArray);

            // 1. Calculate Volume and DB metrics
            let sumSquares = 0;
            for(let i = 0; i < dataArray.length; i++) {
                let normalized = (dataArray[i] - 128) / 128.0; // range -1.0 to 1.0
                sumSquares += normalized * normalized;
            }
            
            // Root Mean Square (RMS) gives a good approximation of perceived volume
            let rms = Math.sqrt(sumSquares / dataArray.length);
            
            // Noise Gate: if signal is extremely low, clamp to 0
            if (rms < NOISE_GATE_THRESHOLD) {
                rms = 0;
            }

            // Convert to decibels based on RMS
            let db = rms > 0 ? 20 * Math.log10(rms) : -100;
            db = Math.max(-100, Math.min(0, db)); // Clamp between -100 and 0
            
            // Convert RMS to a percentage (Multiplier tuned so normal loud music hits ~100%)
            let volumePercent = Math.round(rms * 250); 
            volumePercent = Math.min(100, Math.max(0, volumePercent));

            // Update HUD text independently
            volEl.innerText = `VOLUME ${volumePercent}%`;
            dbEl.innerText = `${db.toFixed(1)}dB`;

            // 2. Draw the visualizer
            const w = canvas.clientWidth;
            const h = canvas.clientHeight;
            
            // Clear previous frame
            ctx.clearRect(0, 0, w, h);

            // Styling
            const size = Math.min(w, h);
            ctx.lineWidth = Math.max(1, size * 0.02);
            ctx.strokeStyle = COLOR;
            ctx.fillStyle = COLOR;
            ctx.lineJoin = 'miter'; // Keeps corners sharp

            const sliceWidth = w / (NUM_VERTICES - 1);
            const step = Math.floor(dataArray.length / NUM_VERTICES);

            ctx.beginPath();
            
            let points = []; // Store vertices so we can draw dots on them later

            for(let i = 0; i < NUM_VERTICES; i++) {
                let dataIndex = i * step;
                let maxDeviation = 0;
                
                // Only scan for peaks if audio is actually playing (above noise gate)
                if (rms > 0) {
                    for(let j = 0; j < step && (dataIndex + j) < dataArray.length; j++) {
                        let dev = (dataArray[dataIndex + j] - 128) / 128.0;
                        if (Math.abs(dev) > Math.abs(maxDeviation)) {
                            maxDeviation = dev;
                        }
                    }
                }

                // Scale the amplitude smoothly to a max of ~85% of half the screen height 
                // to prevent spikes from ever exceeding the top/bottom canvas bounds
                let amplitude = maxDeviation * 0.85; 
                let y = (h / 2) + (amplitude * (h / 2));

                let x = i * sliceWidth;
                points.push({x, y});

                if(i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            
            ctx.stroke(); // Draw the continuous angular line

            // Draw the dots at each vertex
            for(let i = 0; i < points.length; i++) {
                ctx.beginPath();
                ctx.arc(points[i].x, points[i].y, Math.max(1.5, size * 0.035), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    </script>
</body>
</html>
