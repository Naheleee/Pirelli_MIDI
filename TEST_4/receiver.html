<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirelli</title>
    <link rel="stylesheet" href="CSS/style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
</head>

<body>
    <div class="container">
        <div class="box1">
            <div class="section1">
                <div class="cell1">
                    <p class="titolo">PIRELLI</p>
                </div>
                <div class="cell2">
                    <div class="handtracking1">
                        <p class="glifo1">•</p>
                    </div>
                    <div class="looper" aria-label="Four-beat looper">
                        <div class="looper-square active" aria-label="Beat 1">1</div>
                        <div class="looper-square" aria-label="Beat 2">2</div>
                        <div class="looper-square" aria-label="Beat 3">3</div>
                        <div class="looper-square" aria-label="Beat 4">4</div>
                    </div>
                    <div class="launchpad-visualizer"></div>
                </div>
            </div>
            <div class="section2">
                <p class="lettera">A</p>
            </div>
        </div>
        <div class="box2">
            <p class="font-info1">
                <p>Width: 500</p>
                <p class="style-status">Style: Regular</p>
                <p>Visibility: ON</p>
                <p>Music: Ocean</p>
            </p>
        </div>
        <div class="box3">
            <p class="font-info2"></p>
        </div>
        <div class="box4">
            <div class="square1"></div>
            <div class="visualizers">
                <div class="audio-visualizer">
                    <iframe src="audiospectrum.html" title="Audio spectrum visualizer"
                        allow="display-capture *"></iframe>
                    <button class="audio-enable" type="button">Enable audio</button>
                </div>
                <div class="note-visualizer"></div>
            </div>
            <div class="square2"></div>
        </div>
        <div class="box5">
            <div class="lettere"></div>
        </div>
    </div>
    <script src="Javascript/script.js"></script>
</body>

</html>
