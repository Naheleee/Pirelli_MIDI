<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirelli - Letter Canvas</title>
    <link rel="stylesheet" href="../CSS/style.css">
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: hidden;
            background: #1A1A1A;
        }

        .container {
            width: 100%;
            height: 100%;
            grid-template-rows: minmax(0, 1fr);
        }

        .lettere {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
       
        }

        .lettere-riga {
            display: flex;
            width: 100%;
            height: 25%;
            flex: 0 0 25%;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            white-space: nowrap;
        }

        .lettere-riga:first-child,
        .lettere-riga:last-child {
            transform: scaleX(-1);
        }

        .lettera-singola {
            font-size: 270px;
            padding: 0;
        
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="lettere" aria-label="Animated letters"></div>
    </div>
    <script src="../Javascript/vista3.js"></script>
</body>

</html>
